name: Build AntiCheat

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate translations
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check translations
        run: python3 check-translations.py

  build-linux:
    name: Build Linux x86-64
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
      - name: Check out CS2 SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: alliedmodders/s2sdk
          ref: a508eb5ed5fb36f4067fa36a1c33f5fec7d73066
          path: hl2sdk-cs2
      - name: Check out MetaMod:Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: alliedmodders/metamod-source
          ref: ea513d8960c52d266a1c5620dc762def0dd8bce8
          path: metamod-source
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Prepare Linux build scripts
        run: chmod +x build-linux.sh bootstrap.sh
      - name: Compile Linux plugin
        run: ./build-linux.sh AntiCheat/build-linux-ci
      - name: Package Linux server files
        run: |
          cd AntiCheat/build-linux-ci/package
          zip -qr "$GITHUB_WORKSPACE/AntiCheat-1.0.1-linux-x64.zip" game
      - name: Upload Linux package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: AntiCheat-1.0.1-linux-x64
          path: AntiCheat-1.0.1-linux-x64.zip
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows x86-64
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
      - name: Check out CS2 SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: alliedmodders/s2sdk
          ref: a508eb5ed5fb36f4067fa36a1c33f5fec7d73066
          path: hl2sdk-cs2
      - name: Check out MetaMod:Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: alliedmodders/metamod-source
          ref: ea513d8960c52d266a1c5620dc762def0dd8bce8
          path: metamod-source
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Compile Windows plugin
        shell: pwsh
        run: ./build-windows.ps1 -BuildDirectory build-windows-ci
      - name: Package Windows server files
        shell: pwsh
        run: |
          python -c "import zipfile; from pathlib import Path; root=Path('build-windows-ci/package'); files=(root/'game').rglob('*'); archive=zipfile.ZipFile('AntiCheat-1.0.1-windows-x64.zip','w',zipfile.ZIP_DEFLATED); [archive.write(path,path.relative_to(root).as_posix()) for path in files if path.is_file()]; archive.close()"
      - name: Upload Windows package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: AntiCheat-1.0.1-windows-x64
          path: AntiCheat-1.0.1-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
