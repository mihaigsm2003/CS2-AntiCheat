// AntiCheat loads this file automatically.
// Use 1 to enable a setting and 0 to disable it.

// Master switch. Turning this off stops every detector.
AntiCheat_enabled 1

// Whitelisted SteamID64s are still detected and announced, but they are never punished.
// Separate multiple IDs with commas.
// Example: AntiCheat_whitelist "76561198000000001,76561198000000002"
AntiCheat_whitelist ""

// Detection modules. They are all enabled by default.
AntiCheat_aimbot_enabled 1
AntiCheat_aimlock_enabled 1
AntiCheat_antiaim_enabled 1
AntiCheat_autostrafe_enabled 1
AntiCheat_bhop_enabled 1
AntiCheat_dll_injection_enabled 1
AntiCheat_desubticking_enabled 1
AntiCheat_doubletap_enabled 1
AntiCheat_hyperscroll_enabled 1
AntiCheat_inhuman_accuracy_enabled 1
AntiCheat_invalid_cvar_enabled 1
AntiCheat_invalid_input_enabled 1
AntiCheat_irregular_behavior_enabled 1
AntiCheat_namechanger_enabled 1
AntiCheat_nulls_enabled 1
AntiCheat_silentaim_enabled 1
AntiCheat_subtick_spam_enabled 1
AntiCheat_triggerbot_enabled 1

// Detection announcements.
AntiCheat_chat_announcements 1
AntiCheat_center_announcements 1

// Language used for chat, center-screen announcements, and Discord reports.
// Bundled language codes are listed in addons/AntiCheat/translations.
AntiCheat_language "en"

// Commands run after a detection. Leave either value empty to disable that punishment.
// Available placeholders: {steamid64}, {userid}, and {detection}.
AntiCheat_punishment_command "css_addban {steamid64} 0 AntiCheat: {detection}"
AntiCheat_kick_command "css_kick #{userid} AntiCheat: {detection}"

// Optional Discord detection reports. The webhook URL is kept out of console output.
AntiCheat_webhook_url ""
// Optional generic JSON endpoint. It receives one neutral detection object and can run alongside Discord.
AntiCheat_json_webhook_url ""
// Optional bearer token sent as Authorization: Bearer <token> to the JSON endpoint.
AntiCheat_json_webhook_bearer_token ""
// Enter a Discord role ID to mention it on every report, or leave this empty.
AntiCheat_webhook_role_id ""
// Leave empty to use Steam's public server IP and hostport automatically.
AntiCheat_webhook_server_address ""
// Optional public HTTPS logo used for Discord branding and as the avatar fallback.
AntiCheat_webhook_logo_url ""

// Diagnostic messages are quiet by default.
AntiCheat_aimbot_debug 0
AntiCheat_aimlock_debug 0
AntiCheat_antiaim_debug 0
AntiCheat_autostrafe_debug 0
AntiCheat_bhop_debug 0
AntiCheat_dll_injection_debug 0
AntiCheat_doubletap_debug 0
AntiCheat_hyperscroll_debug 0
AntiCheat_inhuman_accuracy_debug 0
AntiCheat_invalid_cvar_debug 0
AntiCheat_irregular_debug 0
AntiCheat_namechanger_debug 0
AntiCheat_nulls_debug 0
AntiCheat_silentaim_debug 0
AntiCheat_subtick_debug 0
AntiCheat_triggerbot_debug 0

// Keep this off on public servers. It only exists for local testing with sv_cheats 1.
AntiCheat_allow_sv_cheats_testing 0

// Keep this last so AntiCheat can confirm that the whole file was applied.
AntiCheat_config_loaded
